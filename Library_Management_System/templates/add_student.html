{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block page_title %}Add Student{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-header">
        <div>
            <h2>Register New Student</h2>
            <p>Add a student/member to the library system.</p>
        </div>
    </div>

    <form method="POST" class="library-form">

        <div class="form-grid">

            <!-- Student ID -->
            <div class="form-group">
                <label for="student_id">Student ID</label>
                <input
                    type="text"
                    id="student_id"
                    name="student_id"
                    placeholder="Example: BWU/MCA/26/022"
                    required
                >
            </div>

            <!-- Student Name -->
            <div class="form-group">
                <label for="name">Student Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter student name"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="student@example.com"
                    required
                >
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="text"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                >
            </div>

        </div>

        <div class="form-actions">

            <a href="{{ url_for('students') }}" class="btn btn-secondary">
                Cancel
            </a>

            <button type="submit" class="btn btn-primary">
                Add Student
            </button>

        </div>

    </form>

</div>

{% endblock %}
